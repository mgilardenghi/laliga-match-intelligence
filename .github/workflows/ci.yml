name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, types, tests
    runs-on: ubuntu-latest
    services:
      # The integration tests need a real PostgreSQL. The credentials are
      # placeholders and the database lives only for the job.
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: lmi
          POSTGRES_DB: lmi
          POSTGRES_PASSWORD: placeholder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lmi -d lmi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Check the lock file matches the manifests
        run: uv lock --check
      - name: Install the workspace from the lock file
        run: uv sync --all-packages --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy apps/api apps/worker packages
      - name: Test (unit)
        run: uv run pytest -m "not integration"
      # The integration step runs the migration and the seed against the service
      # database, so it also proves the schema on a clean server.
      - name: Test (integration)
        env:
          LMI_ALLOW_DESTRUCTIVE_TESTS: "1"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: lmi
          POSTGRES_PASSWORD: placeholder
          POSTGRES_DB: lmi
        run: uv run pytest -m integration

  web:
    name: Dashboard lint, types, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "12.18.0"
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter web lint
      - name: Type check
        run: pnpm --filter web typecheck
      - name: Build
        run: pnpm --filter web build

  docker:
    name: Compose stack
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the env file from the committed template
        run: cp .env.example .env
      # `make up` is the documented one-command start: it waits for db, redis,
      # api and web, then starts the worker, which consumes the job queue. The
      # worker only runs jobs and every job reads PostgreSQL, so no step in this
      # job contacts a live data source: CI never runs the ingestion, and the
      # `scheduler` profile stays off, so the daily beat cycle never fires here.
      - name: Start the stack
        run: make up
      # The worker is long-running, so nothing can wait for it to exit: prove it
      # stays up instead. A short settle lets a crash loop show itself, then the
      # check proves the service is running and that the container has never
      # restarted. A worker that crashed on start, or that a later change turned
      # back into a one-shot job, fails here instead of passing green. This still
      # cannot prove that a worker stays up forever: one that dies after the
      # settle window needs a healthcheck, which this stack does not have, and
      # the timeout bounds the check if `docker compose ps` ever stalls.
      - name: Check the worker is running
        timeout-minutes: 5
        run: |
          sleep 15
          docker compose ps --status running --services | grep -qx worker
          test "$(docker inspect -f '{{.RestartCount}}' "$(docker compose ps -q worker)")" -eq 0
      - name: Check the API health endpoint
        run: curl -fsS localhost:8000/health
      - name: Check the dashboard reports the API as online
        run: |
          curl -fsS localhost:3000 > /tmp/web.html
          grep -q "API status" /tmp/web.html
          grep -q ">online<" /tmp/web.html
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
