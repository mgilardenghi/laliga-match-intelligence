name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, types, tests
    runs-on: ubuntu-latest
    services:
      # The integration tests need a real PostgreSQL. The credentials are
      # placeholders and the database lives only for the job.
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: lmi
          POSTGRES_DB: lmi
          POSTGRES_PASSWORD: placeholder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lmi -d lmi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Check the lock file matches the manifests
        run: uv lock --check
      - name: Install the workspace from the lock file
        run: uv sync --all-packages --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy apps/api apps/worker packages
      - name: Test (unit)
        run: uv run pytest -m "not integration"
      # The integration step runs the migration and the seed against the service
      # database, so it also proves the schema on a clean server.
      - name: Test (integration)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: lmi
          POSTGRES_PASSWORD: placeholder
          POSTGRES_DB: lmi
        run: uv run pytest -m integration

  web:
    name: Dashboard lint, types, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "12.18.0"
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter web lint
      - name: Type check
        run: pnpm --filter web typecheck
      - name: Build
        run: pnpm --filter web build

  docker:
    name: Compose stack
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the env file from the committed template
        run: cp .env.example .env
      # `make up` is the documented one-command start: it waits for the
      # long-running services and then starts the one-shot worker.
      - name: Start the stack
        run: make up
      # The worker is a one-shot job. Wait for it so a failed ingestion fails
      # the job instead of leaving a stopped container behind a green run, with
      # a bound so a stalled job cannot hold the run until the global limit.
      - name: Check the worker job exited cleanly
        timeout-minutes: 15
        run: docker compose wait worker
      - name: Check the API health endpoint
        run: curl -fsS localhost:8000/health
      - name: Check the dashboard reports the API as online
        run: |
          curl -fsS localhost:3000 > /tmp/web.html
          grep -q "API status" /tmp/web.html
          grep -q ">online<" /tmp/web.html
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
